# Free checks on every push and PR — typecheck, lint, unit, MCP server.
# The e2e suites (real model calls, real spend) are deliberately not here.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pi-threading exec tsc --noEmit
      - run: pnpm --filter ./packages/pi-top exec tsc --noEmit
      - run: pnpm run lint
      - run: pnpm run test:unit
